seed: 42

env:
  id: Hexapedal-MuJoCo-Direct-v0
  num_envs: 8

policy:
  type: MlpPolicy
  net_arch: [256, 256]
  activation_fn: tanh

ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

protocol:
  smoke_timesteps: 10000
  baseline_timesteps: 500000
  extension_timesteps: 1000000
  eval_freq: 25000
  eval_episodes: 5
  deterministic_eval: true
  checkpoint_latest_name: latest.zip
  checkpoint_best_name: best.zip
  authoritative_checkpoint: best.zip

logging:
  root_dir: logs/mujoco/hexapedal_direct
  tensorboard_log: logs/mujoco/hexapedal_direct/tensorboard
  eval_metrics_file: eval_metrics.jsonl
  final_scorecard_file: eval_scorecard.json

contract:
  package_import: spider_mujoco
  gym_id: Hexapedal-MuJoCo-Direct-v0
  observation_dim: 48
  action_dim: 18
  command_schema: [vx, vy, wz]
  vy_fixed: 0.0
  desired_contact_site_names:
    - LF_motor_horn_3_1_contact_site
    - LM_motor_horn_3_1_contact_site
    - LB_motor_horn_3_1_contact_site
    - RF_motor_horn_3_1_contact_site
    - RM_motor_horn_3_1_contact_site
    - RB_motor_horn_3_1_contact_site
  undesired_contact_body_patterns:
    - base_link
    - .*_motor_horn_1_1
    - .*_motor_horn_2_1
